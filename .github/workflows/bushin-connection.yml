name: Bushin connection diagnostic
on:
  push:
    paths:
      - 'scripts/check-connection.mjs'
      - '.github/workflows/bushin-connection.yml'
  workflow_dispatch:
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real MCP discovery and authentication barrier
        run: node scripts/check-connection.mjs
