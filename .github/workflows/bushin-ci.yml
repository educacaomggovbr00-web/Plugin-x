name: '🍥 Bushin — validar pacote'
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar manifestos, skills e segredos
        run: python -m unittest discover -s tests -p 'test_*.py' -v
