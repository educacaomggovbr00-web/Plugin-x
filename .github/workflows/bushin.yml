name: '🍥 Bushin — CI único'

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bushin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bushin:
    name: Verificação completa do Bushin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar manifestos e skills
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Instalar dependências Node
        run: npm install --no-audit --no-fund
      - name: Testes locais MCP e segurança do Worker
        run: node --test tests/agent.test.mjs tests/cloudflare-worker.test.mjs
      - name: Validar JavaScript do diagnóstico
        run: node --check scripts/check-connection.mjs
      - name: Diagnóstico do MCP público (sem credenciais)
        run: node scripts/check-connection.mjs
      - name: Smoke OAuth do Discord (somente leitura, sem login)
        run: node tests/mcp_smoke.mjs
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Testar navegação real, leitura e screenshot
        run: npm run test:browser
