name: '🍥 Bushin — Conexão e Testes'

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ai_mode:
        description: 'Tarefa com IA: dry_run (sem custo) ou api (OpenAI API paga separadamente)'
        type: choice
        required: true
        default: dry_run
        options:
          - dry_run
          - api
      ai_task:
        description: 'Pedido para a IA analisar, sem senhas nem tokens (maximo 1200 caracteres)'
        type: string
        required: false
        default: 'Sugira um teste seguro do Bushin sem alterar o Discord.'

permissions:
  contents: read

concurrency:
  group: bushin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bushin:
    name: Verificação completa do Bushin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar manifestos e skills
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Instalar dependências Node
        run: npm install --no-audit --no-fund
      - name: Testes locais MCP e segurança do Worker
        run: node --test tests/agent.test.mjs tests/cloudflare-worker.test.mjs
      - name: Testar portal móvel de conexão separado
        run: |
          node --check cloudflare/bushin-connect-worker.mjs
          node --test tests/connect-hub.test.mjs
      - name: Testar executor de IA (sem custos)
        run: |
          node --check scripts/ai-workflow.mjs
          node --test tests/ai-workflow.test.mjs
      - name: Validar JavaScript dos diagnósticos
        run: |
          node --check scripts/check-connection.mjs
          node --check scripts/chatgpt-handoff.mjs
      - name: Diagnóstico do MCP público (sem credenciais)
        run: node scripts/check-connection.mjs
      - name: Smoke OAuth do Discord (somente leitura, sem login)
        run: node tests/mcp_smoke.mjs
      - name: Testar link público da central móvel (Cloudflare)
        run: |
          node --check scripts/check-hub-live.mjs
          node scripts/check-hub-live.mjs
      - name: Preparar conexão Bushin MCP para o ChatGPT
        run: node scripts/chatgpt-handoff.mjs
      - name: Publicar central de conexão no resumo do workflow
        if: always()
        run: |
          cat <<'BUSHIN_HUB' >> "$GITHUB_STEP_SUMMARY"
          ## 🍥 Acesso pelo celular — Plugin-x

          **[📱 ABRIR O BUSHIN — CONECTAR E TESTAR](https://bushin-connect-lab.henrique-silva081106.workers.dev/)**

          | Serviço | Link seguro | Situação |
          |---|---|---|
          | Discord | [Autorizar pelo portal do Bushin](https://bushin-discord-direct.henrique-silva081106.workers.dev/mobile) | Login OAuth separado |
          | ChatGPT | [Abrir ChatGPT](https://chatgpt.com/) | Conexão do App/MCP exige autorização no ChatGPT |
          | Testes | [Histórico de execuções](https://github.com/educacaomggovbr00-web/Plugin-x/actions/workflows/bushin.yml) | Verifique o resultado desta execução |

          **URL MCP para cadastrar no ChatGPT (onde disponível):**
          `https://bushin-discord-direct.henrique-silva081106.workers.dev/mcp`

          **Importante:** este workflow verifica serviços públicos e executa testes isolados. Não faz login por você, não instala o App, não lê/envia mensagens pessoais e não comprova execução no Android.

          BUSHIN_HUB
      - name: Publicar dados de conexão sem credenciais
        uses: actions/upload-artifact@v4
        with:
          name: bushin-chatgpt-connection
          path: bushin-output/
          if-no-files-found: error
          retention-days: 7
      - name: Instalar Chromium
        run: npx playwright install chromium
      - name: Testar navegação real, leitura e screenshot
        run: npm run test:browser

  ai-task:
    name: Tarefa com IA — acionamento manual
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: bushin
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Baixar laboratorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simular tarefa de IA sem custo (padrao)
        if: inputs.ai_mode == 'dry_run'
        run: node scripts/ai-workflow.mjs
        env:
          BUSHIN_AI_MODE: dry_run
          BUSHIN_AI_TASK: ${{ inputs.ai_task }}
      - name: Executar IA pela OpenAI API (somente apos escolha manual)
        if: inputs.ai_mode == 'api'
        run: node scripts/ai-workflow.mjs
        env:
          BUSHIN_AI_MODE: api
          BUSHIN_AI_TASK: ${{ inputs.ai_task }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Guardar relatorio (sem credenciais)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bushin-ai-task-report
          path: bushin-output/ai-workflow-result.md
          if-no-files-found: warn
          retention-days: 7
